name: Android APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public HTTPS API base URL, including /api"
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate API URL
        run: |
          node -e 'const u=new URL(process.env.EXPO_PUBLIC_API_URL); if(u.protocol!=="https:" || /^(localhost|127\.|10\.|192\.168\.)/.test(u.hostname)) throw Error("A public HTTPS API URL is required")'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck mobile
        run: pnpm --filter @workspace/mobile run typecheck
      - name: Generate Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build installable preview APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Package preview
        run: cp artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk griper-android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: griper-android-preview
          path: griper-android-preview.apk
          retention-days: 30
