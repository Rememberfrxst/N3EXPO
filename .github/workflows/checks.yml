name: Storefront checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: griper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/griper_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/griper_test
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/db run push
      - run: pnpm --filter @workspace/api-server run test
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/admin-web run build
      - name: Export Expo web
        working-directory: artifacts/mobile
        run: pnpm exec expo export --platform web
